name: pr743-review-bundle

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "render = re-render and publish the provisional page; frames = extract key frames from an existing render; bundle = assemble and publish the official validated bundle"
        required: true
        default: render
      artifact_run_id:
        description: "run id of the render run whose batch artifact should be reused (frames and bundle modes)"
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: pr743-review-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GEN: loaded_viscoelastic_strip_creep_reversal
      HEAD: 63347efe67b880f81742980913c5229a421df3eb
      PR: https://github.com/hipo-dev/counterfactual-data/pull/743
      BATCH: ${{ github.workspace }}/pr743-batch
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout this review repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout the private source at the exact reviewed head
        uses: actions/checkout@v4
        with:
          repository: hipo-dev/counterfactual-data
          ref: ${{ env.HEAD }}
          token: ${{ secrets.SOURCE_PAT }}
          path: source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install the pinned generator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          pip install -r source/generators/loaded_viscoelastic_strip_creep_reversal/requirements.txt
          pip check

      - name: Render the three Development cases with runtime provenance
        if: inputs.mode == 'render'
        run: |
          set -euo pipefail
          mkdir -p "$BATCH"
          cd source
          python -u .agents/skills/review-counterfactual-generator/scripts/run_with_provenance.py \
            --generator loaded_viscoelastic_strip_creep_reversal \
            --case-set development-three-recipes \
            --artifact-root "$BATCH" \
            --record "$BATCH/runtime-witness.json" \
            -- python generators/loaded_viscoelastic_strip_creep_reversal/examples/render_development.py \
                 --output "$BATCH" --workers 2

      - name: Restore the rendered batch from the earlier render run
        if: inputs.mode != 'render'
        uses: actions/download-artifact@v4
        with:
          name: pr743-batch-render
          path: ${{ github.workspace }}/pr743-batch
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Runtime witness index and independent witness audit
        if: inputs.mode == 'render'
        run: |
          set -euo pipefail
          cd source
          python .agents/skills/review-counterfactual-generator/scripts/build_runtime_witness_index.py \
            --witness "$BATCH/runtime-witness.json" \
            --expected-cases-json "$BATCH/case-manifest.json" \
            --output "$BATCH/runtime-witness-index.json"
          python .agents/skills/review-counterfactual-generator/scripts/audit_runtime_witness.py \
            --witness "$BATCH/runtime-witness.json" \
            --artifact-root "$BATCH" \
            --output "$BATCH/native-runtime-audit.json"

      - name: Reviewer independent decoded-media audit
        continue-on-error: true
        if: inputs.mode == 'render'
        run: |
          set -euo pipefail
          python reviewer/independent_media_audit.py "$BATCH" "$BATCH/reviewer-independent-media.json"

      - name: Reviewer static scale audit over 100000 seeds
        continue-on-error: true
        if: inputs.mode == 'render'
        run: |
          set -euo pipefail
          python reviewer/static_scale_audit.py \
            source/generators/loaded_viscoelastic_strip_creep_reversal "$BATCH/scale-static.json"

      - name: Production finite-strain controls and reviewer model domain checks
        continue-on-error: true
        if: inputs.mode == 'render'
        run: |
          set -euo pipefail
          cd source
          python generators/loaded_viscoelastic_strip_creep_reversal/examples/finite_strain_controls.py \
            --output "$BATCH/finite-strain-controls.json"
          cd ..
          python reviewer/model_domain_checks.py \
            "$BATCH" source/generators/loaded_viscoelastic_strip_creep_reversal "$BATCH/model-domain.json"

      - name: Exact-head test suite and dependency check
        continue-on-error: true
        if: inputs.mode == 'render'
        run: |
          set -euo pipefail
          cd source
          set +e
          PYTHONPATH="$PWD/generators/loaded_viscoelastic_strip_creep_reversal:$PWD" \
            python -m pytest generators/loaded_viscoelastic_strip_creep_reversal/tests -q > "$BATCH/pytest-stdout.txt" 2>&1
          code=$?
          set -e
          cat "$BATCH/pytest-stdout.txt"
          cd ..
          python reviewer/write_test_report.py "$BATCH" "$code"
          exit $code

      - name: Publish the provisional inspection page and the key frames
        if: always() && (inputs.mode == 'render' || inputs.mode == 'frames')
        run: |
          set -euo pipefail
          python reviewer/provisional_page.py "$BATCH" "$GITHUB_WORKSPACE/publish"
          python reviewer/extract_key_frames.py "$BATCH" "$GITHUB_WORKSPACE/publish/frames"
          rm -rf index.html evidence review.json bundle-manifest.json stage-validation.json frames
          cp -R publish/index.html publish/media publish/frames .
          python reviewer/write_media_hashes.py "$BATCH" media-hashes.json

      - name: Assemble and publish the official validated bundle
        if: always() && inputs.mode == 'bundle'
        run: |
          set -euo pipefail
          test -f reviewer/visual/native-semantic-visual.json
          cp reviewer/visual/native-semantic-visual.json "$BATCH/native-semantic-visual.json"
          python reviewer/assemble_report.py \
            --batch "$BATCH" \
            --visual reviewer/visual/native-semantic-visual.json \
            --head "$HEAD" \
            --pr "$PR" \
            --output "$BATCH/review.json"
          cd source
          python generators/loaded_viscoelastic_strip_creep_reversal/examples/build_review.py \
            --batch "$BATCH" \
            --review "$BATCH/review.json" \
            --pr "$PR" \
            --head "$HEAD" \
            --output "$BATCH/bundle"
          python generators/loaded_viscoelastic_strip_creep_reversal/examples/validate_review.py \
            --bundle "$BATCH/bundle"
          cd ..
          rm -rf index.html evidence review.json bundle-manifest.json stage-validation.json media
          cp -R "$BATCH/bundle/." .
          ls -la

      - name: Commit and publish the site content
        if: always() && (inputs.mode == 'render' || inputs.mode == 'frames' || inputs.mode == 'bundle')
        run: |
          set -euo pipefail
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          paths=""
          for p in index.html evidence review.json bundle-manifest.json stage-validation.json media frames media-hashes.json .nojekyll; do
            if [ -e "$p" ]; then paths="$paths $p"; fi
          done
          if [ -z "$paths" ]; then
            echo "nothing published in this mode"
            exit 0
          fi
          git add -- $paths
          git status --porcelain | head -40
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "Publish PR #743 review bundle rebuilt at ${HEAD} (mode ${MODE})"
            git push origin HEAD:main
          fi

      - name: Check every automatic gate
        if: always() && inputs.mode == 'render'
        run: |
          set -euo pipefail
          python reviewer/check_gates.py "$BATCH"

      - name: Upload the batch evidence as an artifact
        if: always() && inputs.mode == 'render'
        uses: actions/upload-artifact@v4
        with:
          name: pr743-batch-render
          path: ${{ github.workspace }}/pr743-batch
          retention-days: 30
